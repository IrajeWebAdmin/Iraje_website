<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <style>
    .on-light { display: block; }
    .on-dark  { display: none; }
    @media (prefers-color-scheme: dark) {
      .on-light { display: none; }
      .on-dark  { display: block; }
    }
  </style>
  <image class="on-light" width="256" height="256" href="data:image/png;base64,"/>
  <image class="on-dark"  width="256" height="256" href="data:image/png;base64,"/>
</svg>
