# Cloud Build pipeline: build -> push -> migrate -> deploy.
#
# The migration job runs BEFORE the service is deployed, and `--wait` makes a
# failed migration exit non-zero and stop the build there — so a schema that
# didn't apply never gets live traffic pointed at it.
#
# The job reaches Cloud SQL through the same --set-cloudsql-instances socket the
# service uses, so a green job is also proof the service can reach the database.
#
# Fill in the substitutions below (or override them per-trigger), then:
#   gcloud builds submit --config cloudbuild.yaml
#
# The `deploy` verbs create-or-update, so the first run of this pipeline creates
# both the job and the service. The Artifact Registry repo is NOT created for
# you — do that once up front:
#   gcloud artifacts repositories create ${_REPO} \
#     --repository-format=docker --location=${_REGION}

substitutions:
  _REGION: asia-south1
  _REPO: iraje # Artifact Registry repo name
  _SERVICE: iraje-website
  _JOB: iraje-migrate
  _SQL_INSTANCE: "PROJECT:REGION:INSTANCE" # connection name, not the instance name
  _RUNTIME_SA: iraje-run@PROJECT.iam.gserviceaccount.com

  # Secret Manager secret names (values are read at runtime, never baked in).
  # The DATABASE_URL secret should pin the pool size, e.g.
  #   mysql://user:pass@localhost/iraje?socket=/cloudsql/PROJECT:REGION:INSTANCE&connection_limit=5
  # Prisma otherwise defaults to (cpus * 2 + 1) per instance, which multiplied by
  # _MAX_INSTANCES can exhaust a small Cloud SQL tier's max_connections.
  _DB_SECRET: iraje-database-url
  _SMTP_USER_SECRET: iraje-smtp-user
  _SMTP_PASS_SECRET: iraje-smtp-pass
  _SANITY_READ_SECRET: iraje-sanity-read-token
  _SANITY_WRITE_SECRET: iraje-sanity-write-token
  _GRAPH_SECRET: iraje-graph-client-secret

  _SMTP_HOST: smtp.office365.com
  _CONTACT_TO: contact@iraje.com
  _CONTACT_FROM: inquiry@iraje.com
  _MAX_INSTANCES: "10"

  # Sanity CMS (IDs are not secret; the tokens live in Secret Manager above)
  _SANITY_PROJECT_ID: g6lrqpst
  _SANITY_DATASET: production
  _SANITY_API_VERSION: "2026-02-01"

  # Email via Microsoft Graph (client secret lives in Secret Manager above)
  _APP_URL: https://iraje.com
  _MAIL_TRANSPORT: graph
  _GRAPH_TENANT_ID: b25dba39-ac38-4cad-af91-6fea50b66d95
  _GRAPH_CLIENT_ID: 9df50265-c007-4cad-9529-53578639645e

steps:
  # 1. Serving image. Builds deps -> builder -> runner.
  - id: build-app
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=runner
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - .

  # 2. Migration image. All steps in one build share a Docker daemon, so this
  #    reuses the `deps` layers the step above just built rather than re-running
  #    npm ci.
  - id: build-migrator
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=migrator
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_JOB}:$BUILD_ID
      - .

  - id: push-app
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID

  - id: push-migrator
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_JOB}:$BUILD_ID

  # 3. Apply migrations.
  #    --max-retries=0 because a retry is a second concurrent DDL attempt.
  #    --wait blocks until the execution finishes and fails the build if it did.
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_JOB}:$BUILD_ID
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=DATABASE_URL=${_DB_SECRET}:latest
      - --max-retries=0
      - --task-timeout=10m
      - --execute-now
      - --wait

  # 4. Only now does the new revision go live.
  #    No PORT here: Cloud Run injects it and rejects it as a user-set env var.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=DATABASE_URL=${_DB_SECRET}:latest,SMTP_USER=${_SMTP_USER_SECRET}:latest,SMTP_PASS=${_SMTP_PASS_SECRET}:latest,SANITY_API_READ_TOKEN=${_SANITY_READ_SECRET}:latest,SANITY_API_WRITE_TOKEN=${_SANITY_WRITE_SECRET}:latest,GRAPH_CLIENT_SECRET=${_GRAPH_SECRET}:latest
      - --set-env-vars=SMTP_HOST=${_SMTP_HOST},SMTP_PORT=587,SMTP_SECURE=false,CONTACT_TO=${_CONTACT_TO},CONTACT_FROM=${_CONTACT_FROM},SANITY_PROJECT_ID=${_SANITY_PROJECT_ID},SANITY_DATASET=${_SANITY_DATASET},SANITY_API_VERSION=${_SANITY_API_VERSION},APP_URL=${_APP_URL},MAIL_TRANSPORT=${_MAIL_TRANSPORT},MAIL_FROM=${_CONTACT_FROM},GRAPH_TENANT_ID=${_GRAPH_TENANT_ID},GRAPH_CLIENT_ID=${_GRAPH_CLIENT_ID}
      # 1Gi, not the 512Mi default: next/image writes its optimizer cache to the
      # in-memory filesystem, and 30 files in src/ use next/image.
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=${_MAX_INSTANCES}
      - --allow-unauthenticated

options:
  logging: CLOUD_LOGGING_ONLY
  # Next builds are CPU-bound; drop this line to use the default worker.
  machineType: E2_HIGHCPU_8
  # Required when this file is driven by a trigger created through the Cloud Run
  # console: that flow injects its own substitutions (_SERVICE_NAME,
  # _DEPLOY_REGION, _AR_HOSTNAME, _TRIGGER_ID, ...). Cloud Build fails a build
  # when a substitution is supplied but unused, and ALLOW_LOOSE turns that check
  # off — otherwise every build errors before the first step runs.
  substitution_option: ALLOW_LOOSE

timeout: 1800s
